<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="625" viewBox="0 0 1200 625" role="img" aria-labelledby="title desc">
<title id="title">roxyXory — Cyber Terminal dashboard</title>
<desc id="desc">A cyber-green GitHub portfolio dashboard with an RX monogram, a persona card, and cards for Linux, Windows, automation and networking. No private repositories or invented statistics.</desc>
