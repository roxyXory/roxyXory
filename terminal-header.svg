<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="370" viewBox="0 0 1100 370" role="img" aria-labelledby="title desc">
  <title id="title">roxyXory — terminal hacker profile</title>
  <desc id="desc">Dark terminal window with green Linux command-line design, user roxyXory and an abstract server network graphic.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#070e0c"/>
      <stop offset="0.55" stop-color="#0b1512"/>
      <stop offset="1" stop-color="#07100d"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4bffb1"/>
      <stop offset="1" stop-color="#1acb93"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#163d2d" stroke-width="0.6" opacity=".47"/>
    </pattern>
    <filter id="softglow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="content"><rect x="0" y="0" width="1098" height="368" rx="17" /></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', monospace; }
      .dim { fill: #90b3a4; }
      .green { fill: #45f5a5; }
      .terminal { font-size: 18px; letter-spacing: .25px; }
      @keyframes blink { 0%,49% {opacity:1} 50%,100% {opacity:.14} }
      @keyframes pulse { 0%,100% {opacity:.55} 50% {opacity:1} }
      #cursor { animation: blink 1.2s steps(1) infinite; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
    </style>
  </defs>
  <g clip-path="url(#content)">
    <rect width="1100" height="370" fill="url(#background)"/>
    <rect x="0" y="45" width="1100" height="325" fill="url(#grid)" opacity=".65"/>
    <ellipse cx="870" cy="235" rx="190" ry="145" fill="#19ef98" opacity=".07" filter="url(#softglow)" />
    <rect x="0" y="0" width="1100" height="48" fill="#101b17"/>
    <path d="M0 48H1100" stroke="#245040" stroke-width="1"/>
    <circle cx="29" cy="24" r="7" fill="#fa7772"/><circle cx="53" cy="24" r="7" fill="#e6c36b"/><circle cx="77" cy="24" r="7" fill="#45ef9c"/>
    <text x="545" y="30" fill="#9fbbad" font-size="15" class="mono" text-anchor="middle">roxyXory@github: ~ / terminal</text>
    <rect x="1032" y="15" width="44" height="18" rx="4" fill="#0e3628" stroke="#226247"/>
    <text x="1054" y="28" font-size="10" fill="#5affe0" class="mono" text-anchor="middle">SSH</text>

    <text x="53" y="91" fill="#6fae8a" font-size="16" class="mono">$ ./init-profile.sh</text>
    <text x="53" y="151" fill="url(#highlight)" font-weight="700" font-size="58" class="mono" letter-spacing="-2">roxyXory<tspan id="cursor" fill="#a7ffcc">_</tspan></text>
    <text x="54" y="188" fill="#d1ebe0" font-size="18" class="mono">LINUX  <tspan fill="#356b51">/</tspan>  WINDOWS  <tspan fill="#356b51">/</tspan>  AUTOMATION</text>
    <path d="M54 207H622" stroke="#214c39" stroke-width="1"/>

    <text x="54" y="238" fill="#4ff6aa" class="mono terminal">&gt;  ~</text>
    <text x="150" y="238" fill="#c6dfd0" class="mono terminal">whoami</text>
    <text x="54" y="266" fill="#98bba9" class="mono terminal">Systems, scripts &amp; a curious mind.</text>
    <text x="54" y="303" fill="#4ff6aa" class="mono terminal">&gt;  ~</text>
    <text x="150" y="303" fill="#c6dfd0" class="mono terminal">systemctl is-active learning</text>
    <text x="54" y="331" fill="#51eaa4" class="mono terminal">active</text>

    <g opacity=".90" transform="translate(743 80)" stroke="#2c8e65" fill="none">
      <path d="M139 27V60M139 60H47V103M139 60H232V103M47 149V178H139M232 149V178H139" stroke-width="2" stroke-dasharray="6 7" opacity=".8"/>
      <path d="M107 0h64a12 12 0 0 1 12 12v28a12 12 0 0 1-12 12h-64a12 12 0 0 1-12-12V12a12 12 0 0 1 12-12z" fill="#10251d" stroke="#51e5a1" stroke-width="2"/>
      <rect x="7" y="103" width="81" height="46" rx="9" fill="#10241c" stroke="#2e9f71" stroke-width="2"/>
      <rect x="191" y="103" width="81" height="46" rx="9" fill="#10241c" stroke="#2e9f71" stroke-width="2"/>
      <rect x="96" y="177" width="86" height="44" rx="9" fill="#10241c" stroke="#51e5a1" stroke-width="2"/>
      <circle cx="139" cy="61" r="5" fill="#43f1a0" stroke="none" class="pulse"/>
      <circle cx="47" cy="102" r="5" fill="#43f1a0" stroke="none"/><circle cx="231" cy="102" r="5" fill="#43f1a0" stroke="none"/>
      <circle cx="139" cy="177" r="5" fill="#43f1a0" stroke="none"/>
      <text x="139" y="20" class="mono" font-size="13" text-anchor="middle" fill="#b0f1d0" stroke="none">MASTER</text>
      <text x="139" y="37" class="mono" font-size="12" text-anchor="middle" fill="#75bc98" stroke="none">/etc/salt</text>
      <text x="47" y="122" class="mono" font-size="12" text-anchor="middle" fill="#b0f1d0" stroke="none">LINUX</text>
      <text x="47" y="137" class="mono" font-size="10" text-anchor="middle" fill="#75bc98" stroke="none">node-01</text>
      <text x="232" y="122" class="mono" font-size="12" text-anchor="middle" fill="#b0f1d0" stroke="none">WIN11</text>
      <text x="232" y="137" class="mono" font-size="10" text-anchor="middle" fill="#75bc98" stroke="none">node-02</text>
      <text x="139" y="195" class="mono" font-size="11" text-anchor="middle" fill="#b0f1d0" stroke="none">AUTOMATE</text>
      <text x="139" y="210" class="mono" font-size="10" text-anchor="middle" fill="#75bc98" stroke="none">deploy()</text>
    </g>
    <text x="882" y="345" fill="#2f6e4e" font-size="13" text-anchor="middle" class="mono">[ CONNECTION ESTABLISHED ]</text>
  </g>
  <rect x="1" y="1" width="1098" height="368" rx="17" fill="none" stroke="#285341" stroke-width="2"/>
</svg>
