<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
  <title id="title">roxyXory — terminal hacker profile</title>
  <desc id="desc">Dark terminal window with animated Matrix rain, green Linux command-line design, user roxyXory and a Salt master and minion network graphic.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#070e0c"/>
      <stop offset="0.55" stop-color="#0b1512"/>
      <stop offset="1" stop-color="#07100d"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4bffb1"/>
      <stop offset="1" stop-color="#1acb93"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#163d2d" stroke-width="0.6" opacity=".47"/>
    </pattern>
    <filter id="softglow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="content"><rect x="0" y="0" width="1098" height="658" rx="17" /></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', monospace; }
      .dim { fill: #90b3a4; }
      .green { fill: #45f5a5; }
      .terminal { font-size: 18px; letter-spacing: .25px; }
      @keyframes blink { 0%,49% {opacity:1} 50%,100% {opacity:.14} }
      @keyframes pulse { 0%,100% {opacity:.55} 50% {opacity:1} }
      #cursor { animation: blink 1.2s steps(1) infinite; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
    </style>
  </defs>
  <g clip-path="url(#content)">
